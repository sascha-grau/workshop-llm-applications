# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Lektion 08 – Evaluierung, Teil 5: Chunking-Strategien mit promptfoo vergleichen
#
# Lernziel: Du vergleichst die Chunking-Strategien aus Lektion 04 mit vier Kennzahlen in einer Tabelle.
# Braucht:  LM Studio mit E5- und Chat-Modell, `SHOW_THINKING` leer; alle vier Indizes
#           (`npm run l04:0`, dann `l04:1` bis `l04:4`).
# Schreibt: results/lesson-08-promptfoo/05-promptfoo-strategies.html (und ~/.promptfoo/, siehe README).
# Start:    npm run l08:5 -- --filter-first-n 1   (Probelauf: erste Frage, alle vier Provider)
#           npm run l08:5   (Demo: voller Lauf, dauert lange; der Trainer lässt ihn vorab laufen)
# Erklärt:  lessons/08-evaluations/GUIDE.de.md → „Teil 5“ und FAQ.de.md
#
# Aufgabe (1 und 2 brauchen den vollen Lauf. Mittelwerte: Tabelle „Messlauf“ im Guide; einzelne Zellen:
#          Bericht des Trainers, `results/lesson-08-promptfoo/05-promptfoo-strategies.html`):
#   1. Welche Strategie hat die höchste Trefferquote (`source-hit`) und den höchsten MRR? Passt
#      `corpus:headings` zu Teil 1?
#   2. Suche eine Frage, bei der `source-hit` besteht, `correct` aber nicht: Antwort oder Judge?
#   3. Setze bei `corpus:headings` unter `config` zusätzlich `topK: 3` und starte nur diese Zelle:
#      `npm run l08:5 -- --filter-first-n 1 --filter-providers headings`. Was ändert sich?
#      ↺ Danach `topK: 3` wieder entfernen.
#
# Lesen: die Kommentare `# KERN 1–6`. Der Rest ist Handwerk.

description: 'Lektion 08, Teil 5: Chunking-Strategien aus Lektion 04 mit promptfoo vergleichen'

# Die Frage geht unverändert an den Provider; System-Prompt und Kontext baut der Assistent selbst.
prompts:
  - '{{query}}'

# KERN 1: Je Strategie ein Provider: derselbe Assistent (`promptfoo-assistant.ts`), nur ein anderer
# Index (Lektion 04, Teil 1 bis 4).
providers:
  - id: file://promptfoo-assistant.ts
    label: corpus:prepared
    config: { strategy: prepared }
  - id: file://promptfoo-assistant.ts
    label: corpus:headings
    config: { strategy: headings }
  - id: file://promptfoo-assistant.ts
    label: corpus:semantic
    config: { strategy: semantic }
  - id: file://promptfoo-assistant.ts
    label: corpus:questions
    config: { strategy: questions }

# KERN 2: Die Fragen aus dem Fragen-Set von Lektion 05 außer F-11; jede geht an alle Provider.
tests:
  path: file://promptfoo-testcases.ts

defaultTest:
  # Hängt die Begründung jeder Prüfung an die Zelle, damit der HTML-Bericht sie zeigt (`promptfoo-scores.ts`).
  assertScoringFunction: file://promptfoo-scores.ts
  options:
    # KERN 3: Der Judge für `correct` und `faithful`: das Chat-Modell aus `.env` über LM Studio. Ohne
    # diesen Block fragte promptfoo OpenAI in der Cloud. Teil 6 hat eine SYNC-Kopie; ändere beide.
    provider:
      id: file://promptfoo-judge.ts
      config:
        model: '{{ env.REMOTE_MODEL_NAME }}'
        # Fällt auf LM Studio zurück, nie auf OpenAI, falls die Variable fehlt oder leer ist (`true`).
        apiBaseUrl: '{{ env.REMOTE_MODEL_BASE_URL | default("http://localhost:1234/v1", true) }}'
        # Nur der NAME der Variable: promptfoo speichert die Konfiguration jedes Laufs in seiner
        # Datenbank; ein hier eingesetzter Schlüssel stünde dort im Klartext.
        apiKeyEnvar: REMOTE_MODEL_API_KEY
        # LM Studio braucht meist keinen Schlüssel; ohne diese Zeile bräche promptfoo ab.
        apiKeyRequired: false
        # Dieselbe Eingabe soll möglichst dasselbe Urteil ergeben.
        temperature: 0
        # Zeitlimit je Urteil in ms, für beide Judge-Prüfungen. Größer auf langsamer Hardware; sonst
        # ERROR "The judge did not answer within … s". Herleitung: GUIDE.de.md → „Teil 5“.
        timeout: 600000
        # Obergrenze in Tokens je Urteil. Muss Denken und JSON abdecken, falls der Server
        # `reasoning_effort: none` ignoriert. Zu klein: `correct` FAIL "Could not extract JSON",
        # `faithful` ERROR "judge format error".
        max_tokens: 8192
  assert:
    # KERN 4: Suche ohne Sprachmodell, aus den Metadaten des Providers (nicht aus der Antwort).
    # Mittelwert von `source-hit` = Trefferquote, von `mrr` = MRR (Teil 1).
    - type: javascript
      metric: source-hit
      value: "context.vars.expectedSources.split(', ').some((source) => context.providerResponse?.metadata?.sources?.includes(source))"
    # 0 (kein Treffer) zählt als FAIL; maßgeblich ist der Mittelwert der Metrik.
    - type: javascript
      metric: mrr
      value: |
        const expected = context.vars.expectedSources.split(', ');
        const sources = context.providerResponse?.metadata?.sources ?? [];
        const rank = sources.findIndex((source) => expected.includes(source)) + 1;
        return rank > 0 ? 1 / rank : 0;
    # KERN 5: Quellentreue (Teil 2) wie RAGAS: Aussagen zerlegen, jede gegen den Kontext prüfen
    # (`promptfoo-faithfulness.ts`). `threshold` 1 heißt: jede Aussage gedeckt, bewusst streng.
    # Kleiner = grünere Zellen, nicht bessere Antworten; lies den Mittelwert.
    - type: javascript
      metric: faithful
      value: file://promptfoo-faithfulness.ts
      threshold: 1
    # KERN 6: Korrektheit (Teil 3); die Rubrik ist der Prompt des Judge. Der zweite Satz verhindert,
    # dass "finde nichts" als korrekt gilt (`HONEST_NO` in Teil 3); die Ausnahme gilt F-10.
    - type: llm-rubric
      metric: correct
      # Teil 6 hat eine SYNC-Kopie dieser Rubrik; ändere beide, sonst sind die Spalten nicht vergleichbar.
      value: >-
        Die Antwort spricht die erwartete Kernaussage sinngemäß und ohne Widerspruch selbst aus: {{keyPoint}}.
        Eine Antwort, die nur sagt, sie finde dazu nichts oder die Quellen enthielten dazu keine (klare) Angabe,
        ist nicht korrekt – außer die erwartete Kernaussage sagt genau das (z. B. „OWASP nennt keine Zahlen“).

# Ein lokales Modell antwortet nacheinander schneller als parallel.
evaluateOptions:
  maxConcurrency: 1
