# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Lektion 08 – Evaluierung, Teil 6: den laufenden Assistenten als Black Box testen
#
# Lernziel: Du testest die fertige Anwendung nur über ihre API, so wie Open WebUI sie sieht.
# Braucht:  LM Studio mit E5- und Chat-Modell, `SHOW_THINKING` leer; Qdrant mit Collection
#           (`npm run l06:1`); die Fassade in einem zweiten Terminal (`npm run l07:11` oder `l07:8`).
# Schreibt: results/lesson-08-promptfoo/06-promptfoo-black-box.html (und ~/.promptfoo/, siehe README).
# Start:    npm run l08:6   (Probelauf mit der ersten Frage: npm run l08:6 -- --filter-first-n 1)
# Erklärt:  lessons/08-evaluations/GUIDE.de.md → „Teil 6“
#
# Aufgabe:
#   1. Vergleiche Trefferquote und Korrektheit mit `corpus:headings` aus Teil 5. Ist Hybrid besser?
#   2. Setze `id` auf `ollama:chat:lesson-07-score-threshold` und `label` passend (braucht `l07:11`),
#      starte `npm run l08:6 -- --filter-first-n 1`. Lehnt die Anwendung ab? Was urteilt `correct`?
#      ↺ Danach zurücksetzen: `id` auf `ollama:chat:lesson-07-hybrid`, `label` auf `lesson-07-hybrid`.
#   3. Welche Prüfung aus Teil 5 fehlt hier, und warum lässt sie sich über die API nicht rechnen?
#
# Lesen: die Kommentare `# KERN 1–4`. Der Rest ist Handwerk.

description: 'Lektion 08, Teil 6: die laufende Fassade aus Lektion 07 als Black Box testen'

# Die Frage geht unverändert an die Fassade, wie aus dem Chatfenster von Open WebUI.
prompts:
  - '{{query}}'

# KERN 1: Dieselbe Ollama-API wie Open WebUI, Host und Port wie beim Start der Fassade. Mit
# `FACADE_HOST=0.0.0.0` klappt das unter Linux und macOS; unter Windows hier `127.0.0.1` eintragen.
providers:
  - id: ollama:chat:lesson-07-hybrid
    label: lesson-07-hybrid
    env:
      OLLAMA_BASE_URL: 'http://{{ env.FACADE_HOST | default("127.0.0.1", true) }}:{{ env.FACADE_PORT | default("11435", true) }}'

# KERN 2: Dieselben Testfälle wie Teil 5 (ohne F-11); die Collection enthält den öffentlichen Korpus.
tests:
  path: file://promptfoo-testcases.ts

defaultTest:
  options:
    # SYNC (→ 05-promptfoo-strategies.yaml#defaultTest.options.provider): dort sind die Zeilen
    # erklärt. Ändere beide, sonst sind die Ergebnisse nicht vergleichbar.
    provider:
      id: file://promptfoo-judge.ts
      config:
        model: '{{ env.REMOTE_MODEL_NAME }}'
        apiBaseUrl: '{{ env.REMOTE_MODEL_BASE_URL | default("http://localhost:1234/v1", true) }}'
        apiKeyEnvar: REMOTE_MODEL_API_KEY
        apiKeyRequired: false
        temperature: 0
        timeout: 600000
        max_tokens: 8192
  assert:
    # KERN 3: Ein Black-Box-Test sieht nur die Antwort. Gesucht wird nur in der Quellenliste, die die
    # Fassade anhängt (Lektion 07), nicht im Text: Einen Dateinamen im Text könnte das Modell erfinden.
    - type: javascript
      metric: source-hit
      # SYNC (→ lessons/shared/text.ts#SOURCE_LIST_PREFIX): dessen Ende; ändere beide zusammen.
      value: |
        const sourceList = output.split('\n---\n**Quellen').at(-1) ?? '';
        return output.includes('\n---\n**Quellen')
          && context.vars.expectedSources.split(', ').some((source) => sourceList.includes(source));
    # KERN 4: Korrektheit wie in Teil 5 und Teil 3.
    - type: llm-rubric
      metric: correct
      # SYNC (→ 05-promptfoo-strategies.yaml#defaultTest.assert[metric=correct]): ändere beide zusammen.
      value: >-
        Die Antwort spricht die erwartete Kernaussage sinngemäß und ohne Widerspruch selbst aus: {{keyPoint}}.
        Eine Antwort, die nur sagt, sie finde dazu nichts oder die Quellen enthielten dazu keine (klare) Angabe,
        ist nicht korrekt – außer die erwartete Kernaussage sagt genau das (z. B. „OWASP nennt keine Zahlen“).

# Fassade und lokales Modell beantworten eine Frage nach der anderen.
evaluateOptions:
  maxConcurrency: 1
